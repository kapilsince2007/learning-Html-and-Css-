<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forms</title>

    <link rel="stylesheet" href="form.css" />
  </head>
  <body>
    <form action="index.php" method="post" id="form">
      <label for="Username">Username:</label>
      <input
        type="text"
        placeholder="Samir Thapa"
        name="Username"
        id="Username"
        required
      />
      <br />
      <label for="Password">Password:</label>
      <input
        type="password"
        placeholder="Samir321"
        name="Password"
        id="Password"
        minlength="6"
        required
      />
      <br />
      <label for="Email">Email:</label>
      <input
        type="email"
        name="Email"
        id="Email"
        placeholder="samirthapa321@gmail.com"
        required
      />
      <br />
      <label for="Phone">Phone</label>
      <input
        type="tel"
        id="Phone"
        name="Phone"
        placeholder="+977 980-1234567"
        required
        pattern="+977-[0-9]{3}-[0-9]{7}"
      />
      <br />
      <label for="Gender">Gender:</label>
      <label for="Male">Male</label>
      <input type="radio" id="Male" value="Male" name="Gender" />
      <label for="Female">Female</label>
      <input type="radio" id="Female" value="Female" name="Gender" />
      <label for="Others">Others</label>
      <input type="radio" id="Others" value="Others" name="Gender" />
      <br />
      <label for="payment">Payment:</label>
      <select>
        <option value="Esewa" id="payment">Esewa</option>
        <option value="khalti" id="payment">Khalti</option>
        <option value="Visa" id="payment">Visa Card</option>
      </select>
      <br />
      <br />
      <input type="reset" />
      <input type="submit" />
    </form>
    <p>hello world!!!</p>
  </body>
</html>
